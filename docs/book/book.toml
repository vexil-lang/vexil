[book]
title = "Vexil Documentation"
description = "Typed schemas and deterministic binary wire contracts"
authors = ["Vexil contributors"]
language = "en"
src = "src"

[build]
build-dir = "../../target/book"

[output.html]
default-theme = "navy"
preferred-dark-theme = "navy"
additional-css = ["theme/vexil.css"]
git-repository-url = "https://github.com/vexil-lang/vexil"
edit-url-template = "https://github.com/vexil-lang/vexil/edit/main/docs/book/{path}"
