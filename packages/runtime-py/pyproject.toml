[build-system]
requires = [
    "hatchling==1.31.0",
    "packaging==25.0",
    "pathspec==1.0.1",
    "pluggy==1.6.0",
    "trove-classifiers==2026.6.1.19",
]
build-backend = "hatchling.build"

[project]
name = "vexil-runtime"
version = "0.1.0"
description = "Python runtime support for Vexil-generated binary codecs"
readme = "README.md"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE"]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]
keywords = ["serialization", "schema", "binary", "codegen", "vexil"]

[project.urls]
Homepage = "https://github.com/vexil-lang/vexil"
Documentation = "https://vexil-lang.github.io/vexil/"
Repository = "https://github.com/vexil-lang/vexil.git"
"Bug Tracker" = "https://github.com/vexil-lang/vexil/issues"

[tool.hatch.build.targets.wheel]
packages = ["vexil_runtime"]
