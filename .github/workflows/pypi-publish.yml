name: Publish vexil-runtime to PyPI

on:
  push:
    tags:
      - "vexil-runtime-py-v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"

      - name: Install build tools
        run: python -m pip install --disable-pip-version-check build==1.3.0 pytest==9.0.2 tomli==2.2.1 twine==6.2.0

      - name: Verify tag matches package version
        shell: bash
        working-directory: packages/runtime-py
        run: |
          expected="vexil-runtime-py-v$(python -c 'import tomli; print(tomli.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "$GITHUB_REF_NAME" = "$expected"

      - name: Test
        working-directory: packages/runtime-py
        run: python -m pytest vexil_runtime/tests -q

      - name: Build distributions
        working-directory: packages/runtime-py
        run: python -m build

      - name: Check distributions
        working-directory: packages/runtime-py
        run: python -m twine check dist/*

      - name: Verify distribution contents
        run: python .github/scripts/check-python-distributions.py packages/runtime-py/dist/*

      - name: Verify wheel public API
        shell: bash
        working-directory: packages/runtime-py
        run: |
          python -m pip install --force-reinstall dist/*.whl
          cd "$(mktemp -d)"
          python -c 'import vexil_runtime; assert all(hasattr(vexil_runtime, name) for name in vexil_runtime.__all__)'

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: python-distributions
          path: packages/runtime-py/dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/vexil-runtime/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: python-distributions
          path: dist/

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
