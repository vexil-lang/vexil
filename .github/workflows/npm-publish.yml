name: Publish @vexil-lang/runtime to npm

on:
  push:
    tags:
      - "vexil-runtime-ts-v*"

permissions:
  id-token: write
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    if: github.repository == 'vexil-lang/vexil'
    defaults:
      run:
        working-directory: packages/runtime-ts
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22.12.0"
          registry-url: 'https://registry.npmjs.org'

      - run: npm version "${GITHUB_REF#refs/tags/vexil-runtime-ts-v}" --no-git-tag-version --allow-same-version
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: NODE_AUTH_TOKEN="" npm publish --access public --provenance
