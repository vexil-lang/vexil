name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  changes:
    name: Change classification
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.classify.outputs.rust }}
      ts_runtime: ${{ steps.classify.outputs.ts_runtime }}
      go_runtime: ${{ steps.classify.outputs.go_runtime }}
      py_codegen: ${{ steps.classify.outputs.py_codegen }}
      generated_static: ${{ steps.classify.outputs.generated_static }}
      schema: ${{ steps.classify.outputs.schema }}
      generated_targets: ${{ steps.classify.outputs.generated_targets }}
      examples: ${{ steps.classify.outputs.examples }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: classify
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            echo "rust=true" >> "$GITHUB_OUTPUT"
            echo "ts_runtime=true" >> "$GITHUB_OUTPUT"
            echo "go_runtime=true" >> "$GITHUB_OUTPUT"
            echo "py_codegen=true" >> "$GITHUB_OUTPUT"
            echo "generated_static=true" >> "$GITHUB_OUTPUT"
            echo "schema=true" >> "$GITHUB_OUTPUT"
            echo "generated_targets=true" >> "$GITHUB_OUTPUT"
            echo "examples=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed="$(git diff --name-only "${{ github.event.pull_request.base.sha }}"...HEAD)"

          # Default to the complete Rust suite. Only changes known to be isolated
          # from the workspace may opt out; new build inputs stay fail-closed.
          if [[ -n "$changed" ]] && ! grep -Ev '^(docs/book/|packages/runtime-ts/|packages/runtime-go/|CODE_OF_CONDUCT\.md|CONTRIBUTING\.md|FAQ\.md|GOVERNANCE\.md|SECURITY\.md|VERSIONING\.md)$' <<< "$changed"; then
            rust=false
          else
            rust=true
          fi
          echo "rust=$rust" >> "$GITHUB_OUTPUT"
          if grep -Eq '^(crates/vexil-codegen-py/|crates/vexil-lang/|packages/runtime-py/|corpus/valid/|\.github/workflows/ci\.yml)' <<< "$changed"; then
            echo "py_codegen=true" >> "$GITHUB_OUTPUT"
          else
            echo "py_codegen=false" >> "$GITHUB_OUTPUT"
          fi
          if grep -Eq '^(crates/vexil-codegen-(py|ts)/|crates/vexil-lang/|packages/runtime-(py|ts)/|corpus/(valid|projects)/|tools/generated-code-checks/|\.github/workflows/ci\.yml)' <<< "$changed"; then
            echo "generated_static=true" >> "$GITHUB_OUTPUT"
          else
            echo "generated_static=false" >> "$GITHUB_OUTPUT"
          fi
          printf '%s\n' "$changed" |
            bash .github/scripts/classify-generated-changes.sh >> "$GITHUB_OUTPUT"
          if grep -Eq '^(examples/|scripts/examples\.py|crates/vexil-(lang|runtime|codegen-(rust|ts|go|py))/|packages/runtime-(ts|go|py)/|Cargo\.(toml|lock)|\.github/workflows/ci\.yml)' <<< "$changed"; then
            echo "examples=true" >> "$GITHUB_OUTPUT"
          else
            echo "examples=false" >> "$GITHUB_OUTPUT"
          fi

  # Main-branch protection requires this stable gate. Without it, a failed
  # classifier could cause the dependent required jobs to be skipped.
  ci-gate:
    name: CI gate
    needs:
      - changes
      - test
      - ts-runtime
      - go-runtime
      - generated-python
      - generated-targets
      - generated-static
      - examples
      - msrv
      - schema-compat
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require successful validation
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          TEST_RESULT: ${{ needs.test.result }}
          TS_RUNTIME_RESULT: ${{ needs['ts-runtime'].result }}
          GO_RUNTIME_RESULT: ${{ needs['go-runtime'].result }}
          GENERATED_PYTHON_RESULT: ${{ needs['generated-python'].result }}
          GENERATED_TARGETS_RESULT: ${{ needs['generated-targets'].result }}
          GENERATED_STATIC_RESULT: ${{ needs['generated-static'].result }}
          EXAMPLES_RESULT: ${{ needs.examples.result }}
          MSRV_RESULT: ${{ needs.msrv.result }}
          SCHEMA_COMPAT_RESULT: ${{ needs['schema-compat'].result }}
        run: |
          test "$CHANGES_RESULT" = "success"
          for result in \
            "$TEST_RESULT" \
            "$TS_RUNTIME_RESULT" \
            "$GO_RUNTIME_RESULT" \
            "$GENERATED_PYTHON_RESULT" \
            "$GENERATED_TARGETS_RESULT" \
            "$GENERATED_STATIC_RESULT" \
            "$EXAMPLES_RESULT" \
            "$MSRV_RESULT" \
            "$SCHEMA_COMPAT_RESULT"
          do
            test "$result" = "success" || test "$result" = "skipped"
          done

  # ── Cross-platform tests ────────────────────────────────────────────────────
  # Wire golden tests (wire_golden.rs) run on every platform/arch combination
  # below to prove encoding → bytes and bytes → decoding are identical everywhere.
  # A failure that is platform-specific but not universal indicates an endianness
  # or integer-representation bug in the encoder/decoder.
  test:
    name: Test (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ${{ matrix.os }}
    # CI is advisory: it receives only repository read access and no environment.
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest      # Linux x86-64
          - ubuntu-24.04-arm   # Linux arm64
          - windows-latest     # Windows x86-64
          - macos-latest       # macOS arm64 (Apple Silicon)

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache dependencies
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32

      - name: Build
        run: cargo build --workspace

      - name: Test
        run: cargo test --workspace

      - name: Clippy
        run: cargo clippy --workspace -- -D warnings

      - name: Format check
        run: cargo fmt --all -- --check

  # ── TypeScript runtime tests ─────────────────────────────────────────────────
  # Runs @vexil/runtime tests including compliance vectors.
  # Only needs one platform — Node.js is cross-platform.
  ts-runtime:
    name: TypeScript runtime
    needs: changes
    if: needs.changes.outputs.ts_runtime == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: packages/runtime-ts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22.12.0"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  # ── Go runtime tests ──────────────────────────────────────────────────────────
  # Runs @vexil/runtime-go tests.
  # Only needs one platform — Go is cross-platform.
  go-runtime:
    name: Go runtime
    needs: changes
    if: needs.changes.outputs.go_runtime == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: packages/runtime-go
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: "1.22"

      - name: Test
        run: go test -v ./...

  # ── Generated target contract checks ───────────────────────────────────────
  # Compiles function-bearing trait output with each target's native checker,
  # including positive behavior/wire proofs and intentionally incomplete
  # implementations that must be rejected.
  generated-targets:
    name: Generated target contracts
    needs: changes
    if: needs.changes.outputs.generated_targets == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22.12.0"

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: "1.22"

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.10"

      - name: Install TypeScript runtime dependencies
        working-directory: packages/runtime-ts
        run: npm ci

      - name: Install generated-code checker dependencies
        working-directory: tools/generated-code-checks
        run: npm ci --ignore-scripts

      - name: Verify generator goldens
        run: |
          cargo test -p vexil-codegen-rust --test golden
          cargo test -p vexil-codegen-ts --test golden
          cargo test -p vexil-codegen-go --test golden
          cargo test -p vexil-codegen-py --test golden

      - name: Verify native Rust and Go contracts
        run: |
          cargo test -p vexil-codegen-rust --test compile_check trait
          cargo test -p vexil-codegen-go --test compile_check trait

      - name: Verify TypeScript and Python contracts
        working-directory: tools/generated-code-checks
        run: npm run check

      - name: Verify generated Go and Python wire matrix
        working-directory: tools/generated-code-checks
        run: npm run check:wire

      - name: Verify generated change classification
        run: bash .github/scripts/test-classify-generated-changes.sh

  # ── Generated Python validation ─────────────────────────────────────────────
  # Rust golden tests prove text stability; this gate also asks Python to parse
  # every golden and runs focused generated-code probes against the real runtime.
  generated-python:
    name: Generated Python
    needs: changes
    if: needs.changes.outputs.py_codegen == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"

      - name: Generate and compare Python goldens
        run: cargo test -p vexil-codegen-py

      - name: Compile generated Python
        run: python -m py_compile crates/vexil-codegen-py/tests/golden/*.py

      - name: Exercise generated Python runtime probes
        run: |
          python crates/vexil-codegen-py/tests/delta_runtime_probe.py
          python crates/vexil-codegen-py/tests/optional_runtime_probe.py
          python crates/vexil-codegen-py/tests/recursion_runtime_probe.py
          python crates/vexil-codegen-py/tests/result_runtime_probe.py
          python crates/vexil-codegen-py/tests/tombstone_runtime_probe.py
          python crates/vexil-codegen-py/tests/trait_runtime_probe.py
          python crates/vexil-codegen-py/tests/union_runtime_probe.py

  # Native static checkers validate generated target code against the checked-in
  # runtimes. The lockfile pins both tools so local and CI diagnostics agree.
  generated-static:
    name: Generated static checks
    needs: changes
    if: needs.changes.outputs.generated_static == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22.12.0"
          cache: npm
          cache-dependency-path: tools/generated-code-checks/package-lock.json

      - name: Install pinned static checkers
        working-directory: tools/generated-code-checks
        run: npm ci --ignore-scripts

      - name: Generate and compare target goldens
        env:
          VEXIL_TSC: ${{ github.workspace }}/tools/generated-code-checks/node_modules/.bin/tsc
        run: cargo test -p vexil-codegen-py -p vexil-codegen-ts

      - name: Check generated Python with strict Pyright
        working-directory: tools/generated-code-checks
        run: npm run check:python

      - name: Check generated TypeScript with native tsc
        working-directory: tools/generated-code-checks
        run: npm run check:typescript

  # The examples are public adoption paths. Regenerate tracked artifacts and
  # execute each advertised scenario whenever a relevant surface changes.
  examples:
    name: Curated examples
    needs: changes
    if: needs.changes.outputs.examples == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22.12.0"

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: "1.22"

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.10"

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32

      - name: Build local TypeScript runtime
        working-directory: packages/runtime-ts
        run: |
          npm ci --ignore-scripts
          npm run build

      - name: Install TypeScript example dependencies
        run: |
          npm ci --ignore-scripts --prefix examples/cross-language/node-dashboard
          npm ci --ignore-scripts --prefix examples/live-telemetry

      - name: Verify curated examples
        run: python scripts/examples.py check all

  # ── MSRV check ──────────────────────────────────────────────────────────────
  # Ensures the workspace compiles on the declared minimum supported Rust version.
  # MSRV is 1.94 (see CLAUDE.md). Only build+test; clippy/fmt use stable toolchain.
  msrv:
    name: MSRV (1.94)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rust 1.94
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: "1.94.0"

      - name: Cache dependencies
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          key: msrv-1.94

      - name: Build (MSRV)
        run: cargo build --workspace

      - name: Test (MSRV)
        run: cargo test --workspace

  # ── Schema compatibility check ───────────────────────────────────────────────
  # Enforces spec §9/§10: a *.vexil change that vexilc compat classifies as
  # breaking must be paired with at least a matching @version bump. Only
  # meaningful on pull requests, where there's a base revision to diff against.
  schema-compat:
    name: Schema compatibility
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.schema == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Cache dependencies
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32

      - name: Build vexilc
        run: cargo build -p vexilc

      - name: Check schema compatibility vs @version
        run: python3 scripts/check-schema-compat.py "${{ github.event.pull_request.base.sha }}" ./target/debug/vexilc
