name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  changes:
    name: Change classification
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.classify.outputs.rust }}
      ts_runtime: ${{ steps.classify.outputs.ts_runtime }}
      go_runtime: ${{ steps.classify.outputs.go_runtime }}
      schema: ${{ steps.classify.outputs.schema }}
      generated_targets: ${{ steps.classify.outputs.generated_targets }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: classify
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            echo "rust=true" >> "$GITHUB_OUTPUT"
            echo "ts_runtime=true" >> "$GITHUB_OUTPUT"
            echo "go_runtime=true" >> "$GITHUB_OUTPUT"
            echo "schema=true" >> "$GITHUB_OUTPUT"
            echo "generated_targets=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed="$(git diff --name-only "${{ github.event.pull_request.base.sha }}"...HEAD)"

          # Default to the complete Rust suite. Only changes known to be isolated
          # from the workspace may opt out; new build inputs stay fail-closed.
          if [[ -n "$changed" ]] && ! grep -Ev '^(docs/book/|packages/runtime-ts/|packages/runtime-go/|CODE_OF_CONDUCT\.md|CONTRIBUTING\.md|FAQ\.md|GOVERNANCE\.md|SECURITY\.md|VERSIONING\.md)$' <<< "$changed"; then
            rust=false
          else
            rust=true
          fi
          echo "rust=$rust" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$changed" |
            bash .github/scripts/classify-generated-changes.sh >> "$GITHUB_OUTPUT"

  # Main-branch protection requires this stable gate. Without it, a failed
  # classifier could cause the dependent required jobs to be skipped.
  ci-gate:
    name: CI gate
    needs: changes
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require successful classification
        run: test "${{ needs.changes.result }}" = "success"

  # ── Cross-platform tests ────────────────────────────────────────────────────
  # Wire golden tests (wire_golden.rs) run on every platform/arch combination
  # below to prove encoding → bytes and bytes → decoding are identical everywhere.
  # A failure that is platform-specific but not universal indicates an endianness
  # or integer-representation bug in the encoder/decoder.
  test:
    name: Test (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ${{ matrix.os }}
    # CI is advisory: it receives only repository read access and no environment.
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest      # Linux x86-64
          - ubuntu-24.04-arm   # Linux arm64
          - windows-latest     # Windows x86-64
          - macos-latest       # macOS arm64 (Apple Silicon)

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      - name: Install protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache dependencies
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae

      - name: Build
        run: cargo build --workspace

      - name: Test
        run: cargo test --workspace

      - name: Clippy
        run: cargo clippy --workspace -- -D warnings

      - name: Format check
        run: cargo fmt --all -- --check

  # ── TypeScript runtime tests ─────────────────────────────────────────────────
  # Runs @vexil/runtime tests including compliance vectors.
  # Only needs one platform — Node.js is cross-platform.
  ts-runtime:
    name: TypeScript runtime
    needs: changes
    if: needs.changes.outputs.ts_runtime == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: packages/runtime-ts
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "22.12.0"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  # ── Go runtime tests ──────────────────────────────────────────────────────────
  # Runs @vexil/runtime-go tests.
  # Only needs one platform — Go is cross-platform.
  go-runtime:
    name: Go runtime
    needs: changes
    if: needs.changes.outputs.go_runtime == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: packages/runtime-go
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: "1.22"

      - name: Test
        run: go test -v ./...

  # ── Generated target contract checks ───────────────────────────────────────
  # Compiles function-bearing trait output with each target's native checker,
  # including positive behavior/wire proofs and intentionally incomplete
  # implementations that must be rejected.
  generated-targets:
    name: Generated target contracts
    needs: changes
    if: needs.changes.outputs.generated_targets == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      - name: Install protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "22.12.0"

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: "1.22"

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.10"

      - name: Install TypeScript runtime dependencies
        working-directory: packages/runtime-ts
        run: npm ci

      - name: Install generated-code checker dependencies
        working-directory: tools/generated-code-checks
        run: npm ci --ignore-scripts

      - name: Verify generator goldens
        run: |
          cargo test -p vexil-codegen-rust --test golden
          cargo test -p vexil-codegen-ts --test golden
          cargo test -p vexil-codegen-go --test golden
          cargo test -p vexil-codegen-py --test golden

      - name: Verify native Rust and Go contracts
        run: |
          cargo test -p vexil-codegen-rust --test compile_check trait
          cargo test -p vexil-codegen-go --test compile_check trait

      - name: Verify TypeScript and Python contracts
        working-directory: tools/generated-code-checks
        run: npm run check

      - name: Verify generated Go and Python wire matrix
        working-directory: tools/generated-code-checks
        run: npm run check:wire

      - name: Verify generated change classification
        run: bash .github/scripts/test-classify-generated-changes.sh

  # ── MSRV check ──────────────────────────────────────────────────────────────
  # Ensures the workspace compiles on the declared minimum supported Rust version.
  # MSRV is 1.94 (see CLAUDE.md). Only build+test; clippy/fmt use stable toolchain.
  msrv:
    name: MSRV (1.94)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      - name: Install protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rust 1.94
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: "1.94.0"

      - name: Cache dependencies
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae
        with:
          key: msrv-1.94

      - name: Build (MSRV)
        run: cargo build --workspace

      - name: Test (MSRV)
        run: cargo test --workspace

  # ── Schema compatibility check ───────────────────────────────────────────────
  # Enforces spec §9/§10: a *.vexil change that vexilc compat classifies as
  # breaking must be paired with at least a matching @version bump. Only
  # meaningful on pull requests, where there's a base revision to diff against.
  schema-compat:
    name: Schema compatibility
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.schema == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Cache dependencies
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae

      - name: Build vexilc
        run: cargo build -p vexilc

      - name: Check schema compatibility vs @version
        run: python3 scripts/check-schema-compat.py "${{ github.event.pull_request.base.sha }}" ./target/debug/vexilc
