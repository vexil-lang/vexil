name: Provenanced Go Source Candidate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-attest:
    name: Build and attest exact Go source candidate
    if: github.repository == 'vexil-lang/vexil' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: false
      - name: Build the selected deterministic source ZIP
        run: |
          set -euo pipefail
          mkdir artifacts
          cargo run --locked --manifest-path release/validator/Cargo.toml -- \
            --root . \
            --runtime-go-source-candidate-output \
            99e2afef4d48ab35ec61e8b23a9c0d6c210e275f \
            artifacts/runtime-go@v0.1.1.zip
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          archive = Path("artifacts/runtime-go@v0.1.1.zip")
          candidate = json.loads(Path(
              "release/candidates/runtime-go-0.1.1-source-candidate-2026-07-26.json"
          ).read_text(encoding="utf-8"))
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == candidate["archive"]["sha256"]
          assert archive.stat().st_size == candidate["archive"]["size"]
          PY
      - name: Upload the immutable source candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: vexil-runtime-go-0.1.1-source-candidate
          path: artifacts/runtime-go@v0.1.1.zip
          if-no-files-found: error
          compression-level: 0
      - name: Attest the exact source candidate
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6
        with:
          subject-path: artifacts/runtime-go@v0.1.1.zip
