[package]
name = "vexilc"
version = "0.6.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "README.md"
description = "The Vexil schema compiler CLI"
keywords = ["schema", "codegen", "compiler", "protocol", "cli"]
categories = ["compilers", "development-tools", "command-line-utilities"]

[dependencies]
vexil-lang = { path = "../vexil-lang", version = "^0.5.0" }
vexil-codegen-rust = { path = "../vexil-codegen-rust", version = "^0.5.0" }
vexil-codegen-ts = { path = "../vexil-codegen-ts", version = "^0.5.0" }
vexil-codegen-go = { path = "../vexil-codegen-go", version = "^0.5.0" }
vexil-codegen-py = { path = "../vexil-codegen-py", version = "^0.5.0" }
vexil-store = { path = "../vexil-store", version = "^0.5.0" }
ariadne = "0.6"
lsp-server = "0.10.0"
lsp-types = "0.97.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
notify = "8"

[dev-dependencies]
tempfile = "3"
serde_json = "1.0.150"
